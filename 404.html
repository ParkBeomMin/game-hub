<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>페이지를 찾을 수 없어요 · 게임 허브</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3eee4">
  <link rel="icon" href="/game-hub/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/game-hub/css/hub.css">
  <script>
    (function () {
      var s = null; try { s = localStorage.getItem("gamehub.lang.v1"); } catch (e) {}
      var m = /[?&]lang=(ko|en)\b/.exec(location.search); if (m) s = m[1];
      var l = (s === "ko" || s === "en") ? s : ((navigator.language || "").toLowerCase().indexOf("ko") === 0 ? "ko" : "en");
      document.documentElement.lang = l; document.documentElement.setAttribute("data-lang", l);
      document.title = l === "ko" ? "페이지를 찾을 수 없어요 · 게임 허브" : "Not found · Game Hub";
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/game-hub/">
        <img src="/game-hub/assets/favicon.svg" width="34" height="34" alt="">
        <span class="brand-txt"><b><span class="i18n-ko">게임 허브</span><span class="i18n-en">Game Hub</span></b><small><span class="i18n-ko">범민 공방</span><span class="i18n-en">BeomMin's workshop</span></small></span>
      </a>
    </div>
  </header>
  <main class="nf wrap">
    <div class="nf-box">
      <div class="cart" style="--dot:#ff5b3a"><div class="nf-screen">404</div><div class="cart-lbl"><span>No.??</span><i></i></div></div>
      <h1><span class="i18n-ko">이 주소에는 게임이 없어요</span><span class="i18n-en">There's no game at this address</span></h1>
      <p><span class="i18n-ko">주소가 바뀌었거나 잘못 입력된 것 같아요.</span><span class="i18n-en">The link may have changed or been mistyped.</span></p>
      <a class="btn-ink" href="/game-hub/"><span class="i18n-ko">게임 허브로 돌아가기</span><span class="i18n-en">Back to Game Hub</span></a>
    </div>
  </main>
</body>
</html>
